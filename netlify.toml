[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force redirect all Netlify subdomain traffic to custom domain
[[redirects]]
  from = "https://1331-movies-kh.netlify.app/*"
  to = "https://1331-movies-kh.com/:splat"
  status = 301
  force = true

# Ensure all requests use HTTPS
[[redirects]]
  from = "http://1331-movies-kh.com/*"
  to = "https://1331-movies-kh.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "index, follow"
